<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D'ArianFood — Administración</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="marquee">
  <div class="eyebrow">Solo personal autorizado</div>
  <h1>Panel de administración</h1>
  <p class="tagline">Gestiona las mesas y revisa las reservas del día.</p>
  <nav><a href="index.html">← Volver a reservas</a></nav>
</header>

<main class="wrap">

  <section class="card login-box" id="seccion-login">
    <div class="section-title">Acceso</div>
    <form id="form-login">
      <label for="login-email">Correo</label>
      <input type="email" id="login-email" required>
      <div style="height:0.8rem;"></div>
      <label for="login-pass">Contraseña</label>
      <input type="password" id="login-pass" required>
      <div style="height:1.1rem;"></div>
      <button type="submit" class="btn-primary" style="width:100%;">Entrar</button>
    </form>
    <div id="mensaje-login"></div>
  </section>

  <div id="panel-admin" style="display:none;">
    <div id="mensaje-admin" aria-live="polite"></div>

    <section class="card">
      <div class="toolbar">
        <div class="section-title" style="margin:0;">Mesas</div>
        <button class="btn-secondary" id="btn-logout">Cerrar sesión</button>
      </div>

      <form id="form-mesa" class="form-grid" style="margin-bottom:1.25rem;">
        <div>
          <label for="mesa-numero">Número de mesa</label>
          <input type="number" id="mesa-numero" min="1" required>
        </div>
        <div>
          <label for="mesa-capacidad">Capacidad (sillas)</label>
          <input type="number" id="mesa-capacidad" min="1" max="20" required>
        </div>
        <div>
          <label for="mesa-desde">Disponible desde</label>
          <input type="time" id="mesa-desde" required>
        </div>
        <div>
          <label for="mesa-hasta">Disponible hasta</label>
          <input type="time" id="mesa-hasta" required>
        </div>
        <div class="full">
          <button type="submit" class="btn-primary">Añadir mesa</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Mesa</th><th>Sillas</th><th>Horario</th><th></th></tr>
          </thead>
          <tbody id="tabla-mesas"></tbody>
        </table>
      </div>
    </section>

    <section class="card" style="margin-top:1.5rem;">
      <div class="toolbar">
        <div class="section-title" style="margin:0;">Reservas</div>
        <input type="date" id="filtro-fecha" style="max-width:180px;">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Horario</th><th>Mesa</th><th>Cliente</th><th>Tel.</th><th>Personas</th><th></th></tr>
          </thead>
          <tbody id="tabla-reservas"></tbody>
        </table>
      </div>
      <p id="sin-reservas" style="display:none; font-size:0.88rem; color:var(--candle-dim);">No hay reservas para esta fecha.</p>
    </section>

  </div>

</main>

<footer class="foot">D'ArianFood · Panel de administración</footer>

<script src="js/effects.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
